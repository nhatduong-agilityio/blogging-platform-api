name: CI

on:
  pull_request:
    branches: [main, staging, blogging-platform-api]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

  #  Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run unit tests with coverage
        run: NODE_OPTIONS=--experimental-vm-modules pnpm jest --testPathPatterns="__tests__/unit" --coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret

      - name: Upload unit coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: coverage/
          retention-days: 14

  #  Job 3: E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run E2E tests
        # E2E uses in-memory SQLite — no external DB needed
        run: NODE_OPTIONS=--experimental-vm-modules pnpm jest --testPathPatterns="__tests__/e2e"
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          DB_PATH: ':memory:'

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: coverage/
          retention-days: 14

  #  Job 4: Build Validation
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Build TypeScript
        run: pnpm build

      - name: Verify dist output
        run: |
          if [ ! -f "dist/server.js" ]; then
            echo "❌ dist/server.js not found — build failed"
            exit 1
          fi
          echo "✅ dist/server.js found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  #  CI Gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, e2e-tests, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}"  != "success" ] || \
             [ "${{ needs.e2e-tests.result }}"   != "success" ] || \
             [ "${{ needs.build.result }}"        != "success" ]; then
            echo "❌ One or more CI jobs failed"
            echo "  code-quality : ${{ needs.code-quality.result }}"
            echo "  unit-tests   : ${{ needs.unit-tests.result }}"
            echo "  e2e-tests    : ${{ needs.e2e-tests.result }}"
            echo "  build        : ${{ needs.build.result }}"
            exit 1
          fi
          echo "✅ Code quality passed"
          echo "✅ Unit tests passed"
          echo "✅ E2E tests passed"
          echo "✅ Build succeeded"
          echo "🎉 CI pipeline completed successfully!"
