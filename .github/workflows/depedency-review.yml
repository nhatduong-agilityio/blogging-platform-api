name: Dependency Review & Security

on:
  pull_request:
    branches: [main, staging, blogging-platform-api]
    types: [opened, synchronize, reopened]
  schedule:
    # Run security scan weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  #  Dependency Review (PR only)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  #  Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run pnpm audit
        run: |
          echo "Running pnpm audit..."
          pnpm audit --groups dependencies --level moderate > audit-report.txt 2>&1 || true

      - name: Check for critical/high vulnerabilities
        run: |
          if grep -q "critical" audit-report.txt; then
            echo "❌ Critical vulnerabilities found!"
            cat audit-report.txt
            exit 1
          elif grep -q "high" audit-report.txt; then
            echo "⚠️  High severity vulnerabilities found!"
            cat audit-report.txt
            exit 1
          else
            echo "✅ No critical or high severity vulnerabilities found"
          fi
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.txt
          retention-days: 30

  #  Outdated Dependencies (schedule/manual only)
  outdated-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Check for outdated packages
        run: |
          echo "Checking for outdated packages..."
          pnpm outdated > outdated-report.txt 2>&1 || true
          cat outdated-report.txt

      - name: Upload outdated report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-dependencies-report
          path: outdated-report.txt
          retention-days: 30

  #  License Compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Install license checker
        run: pnpm install -g license-checker

      - name: Check licenses
        run: |
          echo "Checking package licenses..."
          license-checker --summary > license-summary.txt 2>&1 || true
          license-checker --json   > license-report.json 2>&1 || true

      - name: Review problematic licenses
        run: |
          if grep -qi "gpl" license-summary.txt; then
            echo "⚠️  GPL licenses found - please review"
            cat license-summary.txt
          else
            echo "✅ No problematic licenses found"
          fi
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: |
            license-summary.txt
            license-report.json
          retention-days: 30

  #  Summary ─
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, license-check]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# 🔒 Security & Dependency Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.security-audit.result }}" == "success" ]; then
            echo "| Security Audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Audit | ⚠️ Issues Found |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.license-check.result }}" == "success" ]; then
            echo "| License Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| License Check | ⚠️ Review Needed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "1. Review security audit reports for any vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "2. Update dependencies with security patches promptly" >> $GITHUB_STEP_SUMMARY
          echo "3. Check license compliance for new dependencies" >> $GITHUB_STEP_SUMMARY
          echo "4. Enable Dependabot for automatic security updates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Scan completed at $(date)*" >> $GITHUB_STEP_SUMMARY
